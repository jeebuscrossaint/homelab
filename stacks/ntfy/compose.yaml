# ntfy: push notifications to your phone. Get the ntfy app, add server https://ntfy.lab,
# subscribe to a topic (like "homelab"). Other apps on the server post to http://ntfy/<topic>.
services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: https://ntfy.${LAB_DOMAIN}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_BEHIND_PROXY: "true"
      # iPhones only get instant notifications through Apple, so ntfy.sh relays a
      # "check for new messages" ping. The message itself never leaves your server.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - ./data:/var/lib/ntfy
    networks: [proxy]

networks:
  proxy:
    external: true
