# Web terminal: https://term.lab gives you a shell on this server in the browser, no login.
# It SSHes in with its own key (data/id_ed25519). install.sh makes the key and adds it to
# your authorized_keys, locked to Docker's network so it only works from this container.
services:
  terminal:
    build: .
    image: homelab-terminal
    container_name: terminal
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data:/data
    command: >
      ttyd --writable
        -t titleFixed=server
        -t fontSize=15
        -t 'fontFamily="JetBrainsMono Nerd Font", "JetBrains Mono", monospace'
        -t cursorBlink=true
        -t 'theme={"background":"#1e1e2e","foreground":"#cdd6f4","cursor":"#f5e0dc","selectionBackground":"#585b70","black":"#45475a","red":"#f38ba8","green":"#a6e3a1","yellow":"#f9e2af","blue":"#89b4fa","magenta":"#f5c2e7","cyan":"#94e2d5","white":"#bac2de","brightBlack":"#585b70","brightRed":"#f38ba8","brightGreen":"#a6e3a1","brightYellow":"#f9e2af","brightBlue":"#89b4fa","brightMagenta":"#f5c2e7","brightCyan":"#94e2d5","brightWhite":"#a6adc8"}'
        ssh -i /data/id_ed25519 -o UserKnownHostsFile=/data/known_hosts -o StrictHostKeyChecking=accept-new
          ${SERVER_USER}@host.docker.internal
    networks: [proxy]

networks:
  proxy:
    external: true
