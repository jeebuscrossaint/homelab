# Web terminal: https://term.lab gives you a shell on this server in the browser, no login.
# It SSHes in with its own key (data/id_ed25519). install.sh makes the key and adds it to
# your authorized_keys, locked to Docker's network so it only works from this container.
services:
  terminal:
    build: .
    image: homelab-terminal
    container_name: terminal
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data:/data
    command: >
      ttyd --writable
        -t titleFixed=server
        -t fontSize=15
        -t 'theme={"background":"#11111b"}'
        ssh -i /data/id_ed25519 -o UserKnownHostsFile=/data/known_hosts -o StrictHostKeyChecking=accept-new
          ${SERVER_USER}@host.docker.internal
    networks: [proxy]

networks:
  proxy:
    external: true
