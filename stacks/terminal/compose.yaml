# Web terminal: https://term.lab gives you a shell on this server in the browser, no login.
# It SSHes in with its own key (data/id_ed25519). install.sh makes the key and adds it to
# your authorized_keys, locked to Docker's network so it only works from this container.
# Colors follow coat (github.com/jeebuscrossaint/coat): its colors module copies
# colors.json into theme/, and start.sh reloads ttyd when it changes.
services:
  terminal:
    build: .
    image: homelab-terminal
    container_name: terminal
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data:/data
      - ./theme:/theme:ro
    environment:
      SERVER_USER: ${SERVER_USER}
    command: sh /start.sh
    networks: [proxy]

networks:
  proxy:
    external: true
