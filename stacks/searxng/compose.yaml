# SearXNG: private search that asks Google/Bing/DDG/etc. for you.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://search.${LAB_DOMAIN}/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./data:/etc/searxng
    networks: [proxy]

networks:
  proxy:
    external: true
