# Homepage: the dashboard. Edit config/services.yaml to add tiles.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
      HOMEPAGE_VAR_LAB_DOMAIN: ${LAB_DOMAIN}
      HOMEPAGE_VAR_TAILSCALE_IP: ${TAILSCALE_IP}
    volumes:
      - ./config:/app/config
      # read-only, so tiles can show if each container is running
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [proxy]

networks:
  proxy:
    external: true
