# IT-Tools: ~80 handy little tools in one page (converters, encoders, QR codes, hashes...). https://tools.lab
services:
  it-tools:
    image: corentinth/it-tools:2024.10.22-7ca5933
    container_name: it-tools
    restart: unless-stopped
    networks: [proxy]

networks:
  proxy:
    external: true
