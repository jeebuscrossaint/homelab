# Dozzle: live logs for every app, with search. https://logs.lab
services:
  dozzle:
    image: amir20/dozzle:v11.3.4
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [proxy]

networks:
  proxy:
    external: true
