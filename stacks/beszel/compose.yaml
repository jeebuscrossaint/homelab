# Beszel: live graphs of CPU, RAM, disk, temps and every container. https://stats.lab
# No login: it makes one user and logs you in automatically (Tailscale-only, so that's fine).
# config.yml adds this machine, and install.sh hands the agent the hub's key (BESZEL_KEY).
services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: https://stats.${LAB_DOMAIN}
      USER_EMAIL: me@${LAB_DOMAIN}.local
      USER_PASSWORD: ${BESZEL_PASSWORD}
      AUTO_LOGIN: me@${LAB_DOMAIN}.local
    volumes:
      - ./data/hub:/beszel_data
      - ./config.yml:/beszel_data/config.yml:ro
      - ./data/socket:/beszel_socket
    networks: [proxy]

  # the agent reads this machine's stats; host network so it sees the real network traffic
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_KEY:-}
    volumes:
      - ./data/agent:/var/lib/beszel-agent
      - ./data/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  proxy:
    external: true
