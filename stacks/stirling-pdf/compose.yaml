# Stirling PDF: every PDF tool you'd want.
services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    volumes:
      - ./data/configs:/configs
      - ./data/tessdata:/usr/share/tessdata
    networks: [proxy]

networks:
  proxy:
    external: true
