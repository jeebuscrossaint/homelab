# Glances: btop in the browser. Live processes, CPU per core, RAM, disks, network, temps. https://top.lab
# Host network + host PIDs so it sees the real machine, not just its container. It listens
# only on the Tailscale IP (not campus wifi). If Tailscale isn't up yet at boot, it exits
# and Docker restarts it until it is.
services:
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
      GLANCES_OPT: -w -B ${TAILSCALE_IP}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
