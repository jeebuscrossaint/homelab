# TINO: Typst editor in the browser with live preview. https://typst.lab
# Login is turned off since only your Tailscale devices can reach it.
services:
  # TINO runs as user 1234, so hand it the data folder first (fresh servers make it as root)
  tino-init:
    image: ghcr.io/confirm/tino:latest
    user: root
    entrypoint: ["chown", "-R", "1234:1234", "/data"]
    volumes:
      - ./data:/data

  tino:
    image: ghcr.io/confirm/tino:latest
    container_name: tino
    restart: unless-stopped
    depends_on:
      tino-init:
        condition: service_completed_successfully
    environment:
      TINO_AUTH_DISABLED: "true"
      TINO_BASE_URL: https://typst.${LAB_DOMAIN}
    volumes:
      - ./data:/data
    networks: [proxy]

networks:
  proxy:
    external: true
