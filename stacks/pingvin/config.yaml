# Pingvin Share settings. It can't read .env, so install.sh fills in the {...} parts
# and writes the result to data/config.yaml, which is the file the app reads.
# While a config file is in use, the settings page in the app is read-only.
# All settings: https://github.com/smp46/pingvin-share-x/blob/main/config.example.yaml
general:
  appName: Share
  # share links point at the public Funnel address, so they work for anyone
  appUrl: https://{PUBLIC_DOMAIN}:8443
  showHomePage: "false"
  showAuthButtons: "false"
security:
  secureCookies: "true"
  allowRegistration: "false"
  allowUnauthenticatedShares: "false"
share:
  defaultExpiration: 7 days

# the one user share.lab signs you in as
initUser:
  enabled: true
  username: me
  email: me@{LAB_DOMAIN}.local
  password: "{PINGVIN_PASSWORD}"
  isAdmin: true
