# Pingvin Share X: upload files at https://share.lab, send anyone the public link.
# No login on share.lab: install.sh makes one user (config.yaml) and Caddy signs you in.
# Public links work for people NOT on your Tailscale through Tailscale Funnel, which
# forwards https://<PUBLIC_DOMAIN>:8443 to port 3001 here. Turn it on once with:
#   sudo tailscale funnel --bg --https=8443 3001
# NOT on the default port 443: Funnel would take over 443 on the Tailscale IP and
# break every .lab site, since Caddy serves those on 443.
# The Funnel address skips Caddy, so outsiders get a login page, not the auto sign-in.
services:
  pingvin:
    image: smp46/pingvin-share-x:v2.0.0
    container_name: pingvin
    restart: unless-stopped
    ports:
      - 127.0.0.1:3001:3000 # only for Funnel, not reachable from the network
    environment:
      TRUST_PROXY: "true" # Caddy and Funnel
      CONFIG_FILE: /opt/app/backend/data/config.yaml # install.sh writes it from config.yaml
    volumes:
      - ./data:/opt/app/backend/data
      - ./data/images:/opt/app/frontend/public/img
    networks: [proxy]

networks:
  proxy:
    external: true
