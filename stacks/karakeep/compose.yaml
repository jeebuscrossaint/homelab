# Karakeep: bookmarks that save a copy of the page, searchable. https://keep.lab
# First visit: sign up (the first account is the admin).
services:
  web:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      NEXTAUTH_URL: https://keep.${LAB_DOMAIN}
      NEXTAUTH_SECRET: ${KARAKEEP_NEXTAUTH_SECRET}
      MEILI_ADDR: http://meilisearch:7700
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_KEY}
      BROWSER_WEB_URL: http://chrome:9222
      # keep a full copy of every saved page, so links still work after sites die
      CRAWLER_FULL_PAGE_ARCHIVE: "true"
    volumes:
      - karakeep-data:/data
    networks: [default, proxy]

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  meilisearch:
    # newest 1.x; it upgrades its own index on start
    image: getmeili/meilisearch:v1
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE: "true"
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_KEY}
    volumes:
      - karakeep-search:/meili_data

volumes:
  karakeep-data:
  karakeep-search:

networks:
  proxy:
    external: true
