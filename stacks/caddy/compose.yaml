# Caddy: turns pdf.<LAB_DOMAIN> etc. into the right container. Edit Caddyfile to add sites.
services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
    networks: [proxy]

networks:
  proxy:
    external: true
