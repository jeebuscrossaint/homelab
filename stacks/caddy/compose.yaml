# Caddy: turns https://pdf.lab etc. into the right container. Edit Caddyfile to add sites.
services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN}
      TAILSCALE_IP: ${TAILSCALE_IP}
      OVERLEAF_PASSWORD: ${OVERLEAF_PASSWORD}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pages:/srv/pages:ro
      - ./data:/data
    networks: [proxy]

networks:
  proxy:
    external: true
