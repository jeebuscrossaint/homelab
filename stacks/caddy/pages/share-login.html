<!doctype html>
<!-- Caddy shows this on share.lab when you're not signed in, and signs you in as the
     one user. install.sh makes that user with PINGVIN_PASSWORD. -->
<meta charset="utf-8">
<title>Share</title>
<body style="background:#fff;font:16px sans-serif;padding:2em">
<p id="msg">Signing in…</p>
<script>
(async () => {
	try {
		const res = await fetch('/api/auth/signIn', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ username: 'me', password: '{{env "PINGVIN_PASSWORD"}}' }),
		})
		const body = await res.json().catch(() => ({}))
		if (!res.ok) throw new Error(body.message || res.status)
		// no cookie would bring us straight back here, so stop instead of looping
		if (!document.cookie.includes('access_token=')) throw new Error('no session cookie')
		location.reload()
	} catch (err) {
		document.getElementById('msg').textContent =
			"Couldn't sign in (" + err.message + '). Run sudo ./install.sh on the server to make the Pingvin user.'
	}
})()
</script>
