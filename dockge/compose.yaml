# Dockge: web UI for starting/stopping/editing everything in ../stacks
# Open https://dockge.lab (or http://<tailscale ip>:5001)
# No login: install.sh makes one user (setup.js) and turns the login screen off.
# It controls Docker, so it only listens on the Tailscale IP, never the Wi-Fi/LAN.
services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - ${TAILSCALE_IP}:5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # Dockge needs the stacks folder at the same path inside and outside
      - ${HOMELAB_DIR}/stacks:${HOMELAB_DIR}/stacks
    environment:
      DOCKGE_STACKS_DIR: ${HOMELAB_DIR}/stacks
    networks: [proxy]

networks:
  proxy:
    external: true
