# SSH: keys only, no passwords (port 22 is reachable from the Wi-Fi/LAN).
# From your own devices, `ssh server` goes through Tailscale SSH instead (install.sh
# turns it on), which uses your Tailscale login, so you don't need a key for that.
# term.lab has its own key. install.sh copies this to /etc/ssh/sshd_config.d/.
PasswordAuthentication no
KbdInteractiveAuthentication no
